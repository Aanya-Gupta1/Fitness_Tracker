# MongoDB credentials (used by both MongoDB and the app).
# Change the password before the first deployment - MongoDB only reads these values
# when its data volume is empty (first start).
# Use a URL-safe password (letters, digits, - _ .) because it is placed inside the connection URI.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: fitness-tracker
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "ChangeMe-Mongo-Password-123"
