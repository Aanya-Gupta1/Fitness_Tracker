# RoleBinding -> ClusterRole: reuses the built-in "view" ClusterRole, but only inside the
# fitness-tracker namespace. "fitness-viewer" can read pods, deployments, services, etc.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fitness-viewer-binding
  namespace: fitness-tracker
subjects:
  - kind: ServiceAccount
    name: fitness-viewer
    namespace: fitness-tracker
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
